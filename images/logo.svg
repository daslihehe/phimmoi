<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#FF3D47" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FFA500" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#E50914" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Film Clapper / Play Icon -->
  <g transform="translate(15, 12)" filter="url(#shadow)">
    <rect x="0" y="0" width="56" height="56" rx="12" fill="url(#logoGrad)" />
    <!-- Clapper stripes -->
    <path d="M 6 6 L 16 6 L 10 18 L 0 18 Z" fill="#FFFFFF" opacity="0.3"/>
    <path d="M 22 6 L 32 6 L 26 18 L 16 18 Z" fill="#FFFFFF" opacity="0.3"/>
    <path d="M 38 6 L 48 6 L 42 18 L 32 18 Z" fill="#FFFFFF" opacity="0.3"/>
    <!-- Play triangle -->
    <polygon points="23,22 41,32 23,42" fill="#FFFFFF" />
  </g>

  <!-- Brand Text -->
  <text x="85" y="47" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="32" fill="#FFFFFF" letter-spacing="1">
    PHIM<tspan fill="url(#logoGrad)">MOI</tspan>
  </text>
  
  <!-- Dot NET Badge -->
  <rect x="238" y="27" width="56" height="24" rx="6" fill="url(#goldGrad)" />
  <text x="266" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="13" fill="#121212" text-anchor="middle" letter-spacing="0.5">.NET</text>

  <!-- Slogan -->
  <text x="86" y="64" font-family="'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="10.5" fill="#AAAAAA" letter-spacing="1.5">CỔNG THÔNG TIN ĐIỆN ẢNH</text>
</svg>
